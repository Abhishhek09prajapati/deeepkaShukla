<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Population Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrapper">
        <div class="card">
            <!-- <img src="./images/bhaiG.png" alt=""> -->
            <img src="./images/hh.png" alt="Banner">
            <h2>जनसंख्या नियंत्रण फीडबैक फॉर्म</h2>
            <p>सभी देशभक्तों की एक ही मांग
                जनसंख्या नियंत्रण अबकी बार।</p>
            <form>
                <div class="inputBox">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                <div class="inputBox">
                    <label>Father Name</label>
                    <input type="text" id="fatherName" placeholder="Enter Father Name" maxlength="10" required>
                </div>
                <div class="inputBox">
                    <label>WhatsApp Number</label>
                    <input type="tel" id="whatsappNumber" placeholder="Enter WhatsApp Number" maxlength="10" required>
                </div>
                <div class="inputBox">
                    <label>Gender</label>
                    <select id="gender" required>
                        <option value="">Choose</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="inputBox">
                    <label>Full Address</label>
                    <input type="text" id="fullAddress" placeholder="Enter Full Address" maxlength="10" required>
                </div>
                <div class="inputBox">
                    <label>Select Feedback</label>
                    <select id="status" required>
                        <option value="">Choose</option>
                        <option value="YES">YES</option>
                        <option value="NO">NO</option>
                    </select>
                </div>
                <button type="submit" id="submit">Submit Feedback</button>
            </form>
        </div>

    </div>

    <script src="index.js"></script>
</body>

</html>
